name: Deploy config generator

on:
  push:
    branches: [main]
    paths:
      - 'config-generator/**'
      - '.github/workflows/deploy-config-generator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-generator/package-lock.json

      - name: Install dependencies
        working-directory: config-generator
        run: npm ci

      - name: Build
        working-directory: config-generator
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: config-generator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
