name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pnpm
        # Pinned to the same version used locally: newer pnpm releases
        # enforce a minimumReleaseAge supply-chain policy that can reject
        # recently published lockfile entries.
        run: npm install -g pnpm@11.1.2

      - name: Install Dependencies 🔧
        working-directory: config-generator
        run: pnpm ci

      - name: Build 🔧
        working-directory: config-generator
        run: pnpm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: config-generator/dist
